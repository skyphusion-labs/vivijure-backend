name: Test and Native Code Coverage

# pytest with coverage (the real test gate), keeping the coverage report as a
# build artifact. The previous version uploaded via actions/upload-code-coverage@v1
# with a code-quality:write permission, both GitHub Enterprise only; on github.com
# that step was a green no-op and the permission was ignored, so the coverage went
# nowhere. pytest runs and gates either way.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Must NOT share coverage.yml's `coverage-${{ github.ref }}` group. GitHub concurrency is
  # repository-wide: coverage.yml (the org-ruleset dummy check, fefc988) cancelled this
  # workflow on PR 432, so the required `ci` job never ran. Keep this group unique.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python environment
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Pytest with Coverage
        run: pytest --cov=. --cov-report=xml:coverage.xml --cov-report=term

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

  ci:
    name: ci
    needs: [coverage]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # STACKED PRs ARE REFUSED HERE, LOUDLY (backend#374).
      #
      # Removing the `branches: [main]` filter above makes these checks RUN on a stacked PR, which
      # is necessary and not sufficient: the branch ruleset requires `ci`, `coverage` and `CodeQL`
      # only for PRs targeting ~DEFAULT_BRANCH, so on a stacked PR NOTHING is required and eight
      # green ticks would still render the PR CLEAN.
      #
      # MEASURED live 2026-08-01 on two throwaway PRs against the same commit:
      #   base=main                -> 8 checks, mergeStateStatus CLEAN
      #   base=another branch      -> 3 checks (the CodeQL family only), mergeStateStatus CLEAN
      # CLEAN there means "no required check failed": true, and worthless, because none ran. Three
      # successes look like a passing PR, which is why this is worse than an empty check set.
      #
      # THIS STEP LIVES IN `ci` ON PURPOSE, because `ci` is one of the three REQUIRED contexts. A
      # refusal in a job of its own would report red and merge anyway, which is the same
      # control-that-cannot-block defect this issue is about.
      #
      # WHY REFUSE RATHER THAN ACCOMMODATE. Estate rule: branch off current `origin/main`, never
      # target a PR at a non-main base. Measured on this repo: #367 merged at 21:07:24Z with
      # `--delete-branch` and its dependent #371 was CLOSED at 21:07:26Z, two seconds later, by
      # nobody. GitHub closes a dependent PR when its base branch is deleted; it does not retarget.
      # Twelve files of reviewed work needed a fresh branch and a cherry-pick to recover.
      #
      # A conflict from branching off main fails loudly at a moment you choose. A stacked base fails
      # at a moment you do not.
      - name: Refuse a stacked PR (base must be main)
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref != 'main'
        run: |
          echo "::error::This PR targets '${{ github.event.pull_request.base.ref }}', not 'main'."
          echo "::error::Stacked PRs are refused here. The required checks (ci, coverage, CodeQL) are"
          echo "::error::REQUIRED only for PRs targeting the default branch, so a stacked PR can render"
          echo "::error::CLEAN with nothing gating it, and its parent merging with --delete-branch"
          echo "::error::CLOSES it rather than retargeting it. See backend#374."
          echo "::error::Fix: git rebase --onto origin/main <old-base> <branch>, then open a fresh PR."
          exit 1

      - name: Require coverage
        run: test "${{ needs.coverage.result }}" = "success"
