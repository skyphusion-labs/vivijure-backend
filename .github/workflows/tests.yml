name: Test and Native Code Coverage

# pytest with coverage (the real test gate), keeping the coverage report as a
# build artifact. The previous version uploaded via actions/upload-code-coverage@v1
# with a code-quality:write permission, both GitHub Enterprise only; on github.com
# that step was a green no-op and the permission was ignored, so the coverage went
# nowhere. pytest runs and gates either way.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Pytest with Coverage
        run: pytest --cov=. --cov-report=xml:coverage.xml --cov-report=term

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

  ci:
    name: ci
    needs: [coverage]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require coverage
        run: test "${{ needs.coverage.result }}" = "success"
