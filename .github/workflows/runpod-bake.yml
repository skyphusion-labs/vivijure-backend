name: Bake runtime image on a RunPod pod

# Dispatch only. A run rents a CPU pod, so nothing here is on a schedule.
# cpu3c, 4 vCPU, secure cloud. Catalog price on 2026-10-19 was $0.03 per
# vCPU per hour, $0.12 per hour of compute, plus container disk until the
# job terminates the pod. No network volume is attached.
#
# Disk default is 120 GB. That is headroom for the keyframe image. The
# changelog records a keyframe cold start of about 50 GiB once the i2v
# weights are not in the image. This cap stops at 160 GB. It is not sized
# for the older Wan-inclusive image. The Dockerfile on main still copies
# that seed; do not dispatch this against that tree until the keyframe
# Dockerfile is the one on main.
#
# RUNPOD_API_KEY is already a repo secret. The job token pushes to GHCR.
#
# HOW SUCCESS IS READ. The REST API has no logs endpoint, so the runner cannot
# read pod stdout. Each run pushes an immutable tag carrying the run id and
# attempt, and the script polls GHCR for it. The digest it reports is the one
# the registry holds, which is the value the repin pins.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type bake to rent the pod.'
        required: true
        type: string
      precision:
        description: 'Baked weight precision.'
        required: true
        default: bf16
        type: choice
        options: [bf16]
      model_version:
        description: 'Model set version. The tag is runtime-<model>-<precision>-t<toolchain>.'
        required: true
        default: '1'
        type: string
      toolchain_version:
        description: 'Toolchain version.'
        required: true
        default: '1'
        type: string
      disk_gb:
        description: 'Container disk in GB (20 to 160). 120 is the keyframe default.'
        required: true
        default: '120'
        type: string

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: runpod-bake-${{ github.repository }}
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    # 140 minutes of bake against a 180 minute job cap. The script's deadline is only
    # checked at the top of each poll, each poll can spend three 60s calls, and the
    # terminate path can spend six GETs with 5s sleeps, so the script can overrun its
    # own deadline by several minutes. The margin has to absorb that, because if the
    # JOB cap fires instead, an always() step is not reliably given time to run and
    # the reap is the backstop.
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refuse unless confirm is bake
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          set -eu
          if [ "$CONFIRM" != "bake" ]; then
            echo "::error::confirm must be the word bake. Nothing was rented."
            exit 1
          fi

      - name: Assert commit is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::commit $GITHUB_SHA is not on origin/main"
            exit 1
          fi

      - name: Refuse while the runtime Dockerfile still carries the weights
        env:
          DISK_GB: ${{ github.event.inputs.disk_gb }}
        run: |
          set -eu
          DF=deploy/runtime.Dockerfile
          [ -f "$DF" ] || { echo "::error::$DF is missing"; exit 1; }
          # The seed image is ~87 GB and the runtime built on top of it measured
          # ~101 GB. Neither fits the 160 GB disk cap, let alone the requested
          # ${DISK_GB} GB. Until the weights leave this image, a dispatch would
          # rent a pod, pull for half an hour, and die out of disk. Fail here
          # instead: two seconds, no bill. Drop this step with the weights.
          # Anchored to the ARG, not the string: the unanchored form also matched the
          # file's own header comment, so removing the weights would not have cleared
          # this gate and the refusal would have named a build that no longer carries
          # them. It failed safe, which is why it was not visible.
          if grep -qE '^ARG SEED_REF' "$DF"; then
            echo "::error::$DF still pulls the seed image, so this build does not"
            echo "::error::fit the ${DISK_GB} GB disk. Nothing was rented."
            exit 1
          fi

      # The inputs arrive through env, never through ${{ }} inside the script. A
      # free-form input substituted into shell SOURCE is executed before any check
      # on it runs: an apostrophe ends the quoting and the rest is code, and the
      # digit validation below cannot help because substitution happens first. This
      # step runs on the same runner, from the same checkout, immediately before the
      # step that puts RUNPOD_API_KEY in the environment, so repo-write would become
      # possession of a credential that rents compute. CodeQL cannot see this: its
      # default Actions threat model does not treat workflow_dispatch inputs as
      # untrusted, so "Analyze (actions) passed" is not evidence either way.
      - name: Resolve tag
        id: cfg
        env:
          PREC: ${{ github.event.inputs.precision }}
          MVER: ${{ github.event.inputs.model_version }}
          TVER: ${{ github.event.inputs.toolchain_version }}
        run: |
          set -eu
          case "$PREC" in bf16) ;; *) echo "::error::precision must be bf16"; exit 1;; esac
          case "$MVER" in ''|*[!0-9]*) echo "::error::model_version must be a positive integer"; exit 1;; esac
          case "$TVER" in ''|*[!0-9]*) echo "::error::toolchain_version must be a positive integer"; exit 1;; esac
          echo "precision=$PREC" >> "$GITHUB_OUTPUT"
          echo "tag=runtime-$MVER-$PREC-t$TVER" >> "$GITHUB_OUTPUT"
          echo "immutable_tag=runtime-$MVER-$PREC-t$TVER-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Build and push on a pod
        id: bake
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISK_GB: ${{ github.event.inputs.disk_gb }}
        run: |
          set -eu
          python3 scripts/runpod_image_bake.py run \
            --name "bake-${GITHUB_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --sha "${GITHUB_SHA}" \
            --dockerfile deploy/runtime.Dockerfile \
            --destination "ghcr.io/${GITHUB_REPOSITORY}:${{ steps.cfg.outputs.tag }}" \
            --destination-immutable "ghcr.io/${GITHUB_REPOSITORY}:${{ steps.cfg.outputs.immutable_tag }}" \
            --disk-gb "$DISK_GB" \
            --build-arg "VJ_BAKE_PRECISION=${{ steps.cfg.outputs.precision }}" \
            --ghcr-user "${GITHUB_ACTOR}" \
            --digest-out "$RUNNER_TEMP/digest.txt" \
            --pod-id-out "$RUNNER_TEMP/pod-id.txt" \
            --pod-name-out "$RUNNER_TEMP/pod-name.txt" \
            --timeout-minutes 140
          echo "digest=$(tr -d ' \n\r' < "$RUNNER_TEMP/digest.txt")" >> "$GITHUB_OUTPUT"

      - name: Open or update the RUNTIME_REF repin pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          PREC='${{ steps.cfg.outputs.precision }}'
          ARGNAME="RUNTIME_REF_$(echo "$PREC" | tr '[:lower:]' '[:upper:]')"
          NEWREF="ghcr.io/${GITHUB_REPOSITORY}:${{ steps.cfg.outputs.tag }}@${{ steps.bake.outputs.digest }}"
          BRANCH="auto/runtime-repin-${PREC}"
          TARGETS="deploy/Dockerfile .runpod/Dockerfile"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B "${BRANCH}" origin/main
          for f in ${TARGETS}; do
            [ -f "${f}" ] || { echo "::error::${f} is missing"; exit 1; }
            n="$(grep -c "^ARG ${ARGNAME}=" "${f}" || true)"
            if [ "${n}" != "1" ]; then
              echo "::error::expected exactly 1 ^ARG ${ARGNAME}= line in ${f}, found ${n}"
              exit 1
            fi
          done
          if ! cmp -s deploy/Dockerfile .runpod/Dockerfile; then
            echo "::error::deploy/Dockerfile and .runpod/Dockerfile differ on main"
            exit 1
          fi
          for f in ${TARGETS}; do
            sed -i "s|^ARG ${ARGNAME}=.*|ARG ${ARGNAME}=${NEWREF}|" "${f}"
          done
          if ! cmp -s deploy/Dockerfile .runpod/Dockerfile; then
            echo "::error::the two Dockerfiles diverged during the repin"
            exit 1
          fi
          if git diff --quiet -- ${TARGETS}; then
            echo "Both Dockerfiles already pin ${NEWREF}."
            exit 0
          fi
          git add ${TARGETS}
          git commit -m "build(bake): repin ${ARGNAME} to the re-baked runtime"
          git push --force origin HEAD:refs/heads/${BRANCH}
          gh pr create --base main --head "${BRANCH}" \
            --title "build(bake): repin ${ARGNAME} to the re-baked runtime" \
            --body "Automated RUNTIME_REF digest bump from a RunPod pod bake. New base: ${NEWREF}. Both Dockerfiles move together. Merge through the gate. Fixed branch, so a later bake updates this pull request." \
            || gh pr view "${BRANCH}" --json url >/dev/null

      # The script terminates the pod in its own finally, which covers a normal exit,
      # an exception, and a cancel, since SIGINT raises into it. (An earlier version
      # of this comment said a cancel does not run the finally. That was wrong.) The
      # genuinely uncovered case is a dead runner, where nothing inside the job runs
      # at all, and this step is what stands between that and a pod that bills on.
      #
      # It reaps by NAME when no id was written, because a create can leave a pod
      # running whose id never reached the script: the POST can time out after RunPod
      # has made the pod. The name is written before the create for exactly that case.
      - name: Terminate any pod left behind
        if: always()
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          set -eu
          POD_ID=""
          POD_NAME=""
          [ -s "$RUNNER_TEMP/pod-id.txt" ] && POD_ID="$(tr -d ' \n\r' < "$RUNNER_TEMP/pod-id.txt")"
          [ -s "$RUNNER_TEMP/pod-name.txt" ] && POD_NAME="$(tr -d ' \n\r' < "$RUNNER_TEMP/pod-name.txt")"
          if [ -n "$POD_ID" ]; then
            python3 scripts/runpod_image_bake.py reap --pod-id "$POD_ID"
          elif [ -n "$POD_NAME" ]; then
            echo "::warning::no pod id was written; reaping by name $POD_NAME"
            python3 scripts/runpod_image_bake.py reap --name "$POD_NAME"
          else
            echo "Neither a pod id nor a pod name was written. Nothing was rented."
          fi
