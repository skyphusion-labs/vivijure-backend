name: Release worker image to GHCR (baked)

# Build + push the BAKED worker image (the "one singular baked image": the curated model set is
# baked in, so a worker is datacenter-agnostic and pays no R2 cold-pull tax). Image + version come
# from a git TAG, not a parsed commit subject. One release track:
#
#   backend-vX.Y.Z  ->  ghcr.io/skyphusion-labs/vivijure-backend:X.Y.Z
#
# No :latest (nothing pins it; constellation doctrine is pinnable :X.Y.Z only --
# vivijure#789). A plain commit/branch push is a NO-OP: this workflow only triggers on backend-v* tags (or a manual
# workflow_dispatch). This pipeline BUILDS + PUSHES only. SHIPPING TO PROD IS SEPARATE: an image
# reaches the production serverless endpoint ONLY by passing the pod-staging verify (.github/
# workflows/runpod-verify.yml) -- see docs/release-gate.md. An iteration tag never re-pins prod.
#
# WEIGHTS + RUNTIME COME FROM THE PINNED RUNTIME BASE (#537, Shape Y): this build is assemble + push
# only -- `FROM ghcr.io/skyphusion-labs/vivijure-backend-runtime:<ver>@sha256:<digest>` (selected by
# VJ_BAKE_PRECISION) + COPY src. No R2 stage, no bin-pack, no weight COPY. A src-only release re-pushes
# ONLY the app layers; the runtime + weight layers dedup on GHCR. The runtime base itself is built by
# runtime-build.yml (from the seed image, which stages R2 once per weight version); see
# docs/deploy.md for the release contract and docs/weights-base-and-snapshots.md for the chain.
#
# Runner: Plane C `[self-hosted, gpu-device]` (org runner group vivijure-gpu-builds, id 9; propagandhi +
# fatmike, fc#754), the sole vivijure image-bake lane -- enterprise heavy/bake runners are RETIRED.
# vivijure-backend is a PUBLIC repo, so a fleet Plane B runner is off the table (a fork PR could run
# untrusted code on a fleet box); Plane C is dedicated GPU iron, NOT a fleet box, allow-public ON,
# and access is gated by the runner-group allowlist (sync-vivijure-gpu-builds-allowlist.sh) plus the
# backend-v* tag ruleset (backend-release-tags, id 18524678) -- a fork PR cannot create a backend-v*
# tag, so untrusted code never reaches it. The runtime base is `FROM`'d from a pinned GHCR digest
# (#537); on a Plane C host that already cached it from a prior bake the FROM is a fast local hit,
# and the bake is assemble+push only. A cold or stale local cache degrades to a one-time docker pull
# of the base -- SLOW, never WRONG. (Tag-push / dispatch only; a fork PR cannot create a backend-v*
# tag.)

on:
  push:
    tags:
      - 'backend-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version X.Y.Z (manual build; tag builds derive it from the tag).'
        required: true
        type: string
      precision:
        description: 'Baked weight precision (selects the pinned runtime base).'
        required: true
        default: bf16
        type: choice
        options: [bf16, fp8]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: skyphusion-labs
  WORKER_IMAGE: vivijure-backend

jobs:
  # Inline sync: public repo cannot workflow_call internal fleet-chezmoi.
  sync-gpu-allowlist:
    if: startsWith(github.ref, 'refs/tags/backend-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout fleet-chezmoi (sync script)
        uses: actions/checkout@v7
        with:
          repository: skyphusion-labs/fleet-chezmoi
          ref: main
          token: ${{ secrets.RUNNER_GROUP_ADMIN_TOKEN }}

      - name: Sync vivijure-gpu-builds allowlist
        env:
          GH_TOKEN: ${{ secrets.RUNNER_GROUP_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/sync-vivijure-gpu-builds-allowlist.sh \
            --apply \
            --ensure-tag "vivijure-backend" "${{ github.ref_name }}"

  build-and-push:
    needs: sync-gpu-allowlist
    if: always() && (needs.sync-gpu-allowlist.result == 'success' || needs.sync-gpu-allowlist.result == 'skipped')
    # Plane C `[self-hosted, gpu-device]`: a host-persistent JIT runner, so a runtime base already pulled on
    # a prior bake is a local cache hit (assemble+push only, no cold base pull). Access control = the
    # vivijure-gpu-builds runner-group allowlist + the backend-v* tag ruleset (backend-release-tags);
    # a fork PR cannot create a backend-v* tag. A cold or stale local cache degrades to a one-time
    # base pull -- SLOW, never WRONG. Accelerator only; identical output.
    runs-on: [self-hosted, gpu-device]
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Assert commit is on main (no publish of an unreviewed release)
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::commit $GITHUB_SHA is not on origin/main; refusing to publish an unreviewed release"
            exit 1
          fi

      - name: Resolve version + precision
        id: cfg
        run: |
          set -eu
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VER="${{ inputs.version }}"
            PREC="${{ inputs.precision }}"
          else
            # github.ref_name is the tag on a tag push, e.g. "backend-v0.2.30".
            TAG="${GITHUB_REF_NAME}"
            if [[ "${TAG}" =~ ^backend-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              VER="${BASH_REMATCH[1]}"
            else
              echo "::error::Tag '${TAG}' is not a backend-vX.Y.Z release tag; nothing to build."
              exit 1
            fi
            # Precision for a tag build comes from a repo variable (default bf16, the self-contained
            # public/prod track). Set vars.VJ_BAKE_PRECISION=fp8 to cut an fp8 (partial-prod) release.
            PREC="${{ vars.VJ_BAKE_PRECISION }}"
            [ -n "${PREC}" ] || PREC="bf16"
          fi
          case "${PREC}" in fp8|bf16) ;; *) echo "::error::precision must be fp8 or bf16"; exit 1;; esac
          echo "version=${VER}"   >> "$GITHUB_OUTPUT"
          echo "precision=${PREC}" >> "$GITHUB_OUTPUT"
          echo "Building ${WORKER_IMAGE}:${VER} (precision=${PREC}; FROM the pinned runtime base)."

      # Use the DOCKER driver (not the default docker-container driver): its build cache IS the daemon
      # image store, so a runtime base already cached on this Plane C GPU host from a prior bake is a
      # local hit instead of a re-pull. Single-platform amd64 needs no docker-container features
      # (#537 pull win).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      # GHCR auth uses the workflow's built-in GITHUB_TOKEN (packages:write above), not a long-lived
      # PAT. The package is linked to THIS repo, so GITHUB_TOKEN can push it -- least-privilege, blast
      # radius of one workflow run.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build context is the repo ROOT (COPY src/ resolves). deploy/Dockerfile is `FROM the pinned
      # runtime base` + COPY src, selected by VJ_BAKE_PRECISION -- NO R2 stage, NO bin-pack, NO weight
      # COPY here. On a warm Plane C host the runtime base is already cached (assemble+push only); on a
      # cold or stale local cache it is a one-time docker pull (SLOW, never WRONG). Load into the local daemon
      # (not pushed) so the per-layer gate + app import smoke run before publish.
      - name: Build baked worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          # NO pull: true -- the FROM runtime base is digest-pinned (immutable), so pull-if-absent is
          # as correct as pull-always and a local-store hit when the daemon is warm (#537 pull win).
          pull: false
          load: true
          push: false
          build-args: |
            VJ_BAKE_PRECISION=${{ steps.cfg.outputs.precision }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.WORKER_IMAGE }}:${{ steps.cfg.outputs.version }}

      # Authoritative per-layer gate (post-build): assert no image layer is >=10GB, so GHCR will accept
      # the push. The bin step predicts this; this confirms it on the real image.
      - name: Verify image layers under the 10GB GHCR ceiling
        run: |
          set -eu
          IMG="${REGISTRY}/${OWNER}/${WORKER_IMAGE}:${{ steps.cfg.outputs.version }}"
          python deploy/bake_layers.py verify-image --image "${IMG}" --ceiling-gb 10.0

      # Import smoke AFTER build, BEFORE push: a missing runtime dep fails here in seconds rather than
      # after a 33-min GPU render. (The baked weights' RENDER correctness is validated separately on a
      # GPU pod by runpod-verify.yml -- the staging gate before prod.)
      #
      # --gpus all IS LOAD-BEARING (backend#349). smoke_imports.py upgrades itself the moment a GPU is
      # visible: without one it prints a loud SKIP and exits 0, and that SKIP is what CI executed on
      # every release until now. A provider NAME is not a working provider -- onnxruntime-gpu 1.28.0
      # imports cleanly, advertises CUDAExecutionProvider, and still hands back a CPU session against
      # this CUDA 12.8 base. Only creating a real session catches it, and that needs a real GPU. This
      # job pins [self-hosted, gpu-device], so the hardware is under the job; the flag is what lets the
      # check reach it. gpu-device is propagandhi + fatmike, both with the nvidia container runtime
      # registered in dockerd (verified 2026-07-31), so either can serve this step.
      #
      # DO NOT widen this job to `bake-capable`. That label is carried by 7 runners and only these two
      # have a card, so 5 of them would run smoke_imports.py with no GPU -- where it prints its SKIP,
      # exits 0, and the release goes green having verified nothing. That is exactly the state
      # backend#349 was opened to end, and it would come back silently.
      #
      # What this step still does NOT cover: it proves the face-embedding wheel initialises its CUDA
      # EP, not that a render is correct. Output correctness is runpod-verify.yml on a pod.
      - name: Import smoke + CUDA EP session (GPU)
        run: |
          set -eu
          IMG="${REGISTRY}/${OWNER}/${WORKER_IMAGE}:${{ steps.cfg.outputs.version }}"
          docker run --rm --gpus all "${IMG}" \
            conda run --no-capture-output -n vivijure \
            python /opt/vivijure/smoke_imports.py

      - name: Push :X.Y.Z to GHCR
        run: |
          set -eu
          IMG="${REGISTRY}/${OWNER}/${WORKER_IMAGE}"
          docker push "${IMG}:${{ steps.cfg.outputs.version }}"
          echo "Pushed ${WORKER_IMAGE}:${{ steps.cfg.outputs.version }} to GHCR."
          echo "PROMOTION TO PROD IS SEPARATE: runpod-verify.yml verifies on a GPU pod (staging), then"
          echo "promotes the passing image onto the production serverless endpoint. See docs/release-gate.md."
