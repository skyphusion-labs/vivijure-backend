name: Build runtime base image to GHCR (#537)

# Build + push the RUNTIME BASE image (Shape Y, #537): the full validated runtime (CUDA/torch/conda +
# render deps + finish patches + RIFE + HF config bake) with the model WEIGHTS COPY --from'd out of the
# pinned, immutable SEED image. The consuming backend release (release.yml) is then just
# `FROM this@digest` + COPY src, so a src-only release re-pushes ONLY the app layers.
#
#   ghcr.io/skyphusion-labs/vivijure-backend:runtime-<model_version>-<precision>-t<toolchain_version>  (a TAG in the vivijure-backend package)
#
# TWO BUILD MODES (workflow_dispatch input `overlay_from`):
#   * empty (default) -- full `deploy/runtime.Dockerfile` FROM nvidia/cuda + COPY --from=seed.
#     Required for CUDA/torch/apt/seed changes. WARNING: BuildKit may re-emit weight layers under
#     NEW digests even when the seed pin is unchanged (t2 vs t1, 2026-07-15: ~101 GB RunPod miss).
#   * set to a prior runtime ref (tag@digest) -- `deploy/runtime-overlay.Dockerfile` FROMs that
#     runtime and only refreshes pip deps. Weight layers inherit by blob identity. USE THIS for
#     deps-only toolchain bumps (safetensors/tokenizers/transformers/…).
#
# NO R2 here: the weights come from the seed image (seed-build.yml stages R2 exactly once per weight
# version). Rebuild triggers: a toolchain/deps/CUDA bump (bump toolchain_version) OR a weight bump
# (rebuild the seed, repin SEED_REF in deploy/runtime.Dockerfile, bump model_version).
#
# workflow_dispatch ONLY (never fork-reachable). Runs on Plane C `[self-hosted, gpu]`
# (vivijure-gpu-builds; fc#754). First bake may cold-pull the seed; later builds hit local docker
# cache. Manifest gate still verifies every baked weight. GH snapshot lane RETIRED.

on:
  workflow_dispatch:
    inputs:
      precision:
        description: 'Baked weight precision (selects the pinned seed stage in runtime.Dockerfile).'
        required: true
        default: bf16
        type: choice
        options: [bf16, fp8]
      model_version:
        description: 'Model set version (must match the seed the Dockerfile pins).'
        required: true
        default: '1'
        type: string
      toolchain_version:
        description: 'Toolchain version -> the -t<N> tag suffix (bump on a CUDA/torch/deps change).'
        required: true
        default: '1'
        type: string
      overlay_from:
        description: >-
          Optional prior runtime ref (e.g. ghcr.io/skyphusion-labs/vivijure-backend:runtime-1-bf16-t1@sha256:…).
          When set, build via deploy/runtime-overlay.Dockerfile (deps-only; inherits weight layers).
          Leave empty for a full FROM-cuda + COPY --from=seed rebuild.
        required: false
        default: ''
        type: string
  # Monthly CVE-refresh FLOOR (#537 cadence): baked images rot -- CVEs + stale toolchains freeze in at
  # bake time, and since every release inherits the runtime's layers, runtime age = shipped CVE posture.
  # The scheduled run rebuilds WHATEVER is currently shipped (reads the pin, no drift) at the SAME tag
  # with a fresh base/apt/pip-patch layer set and opens a RUNTIME_REF digest-bump PR. A deliberate
  # toolchain bump still goes through the workflow_dispatch inputs above.
  # NOTE: the schedule still does a FULL rebuild today; prefer overlay_from for deps-only dispatch.
  schedule:
    - cron: '0 6 1 * *'   # 06:00 UTC, 1st of each month

permissions:
  contents: write         # push the auto-repin branch
  packages: write         # push the runtime image; pull the seed
  pull-requests: write    # open the RUNTIME_REF repin PR

concurrency:
  group: runtime-build-${{ github.event.inputs.precision || 'scheduled' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: skyphusion-labs
  RUNTIME_IMAGE: vivijure-backend   # runtime is a `runtime-*` TAG in the CONSUMER's package
                                    # so FROM-inheritance dedups same-repo (#537 fix)

jobs:
  build-and-push:
    # Plane C `[self-hosted, gpu]` (org runner group vivijure-gpu-builds, id 9; propagandhi + fatmike,
    # fc#754): a host-persistent JIT runner, so the local docker image store survives across jobs and
    # `FROM seed` is a warm local cache hit on a repeat bake, skipping the ~87 GB seed pull (a cold
    # runner pays it once). Same runner release.yml uses; both bakes are dispatch-gated + infrequent,
    # so no meaningful contention.
    runs-on: [self-hosted, gpu]
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Assert commit is on main (no publish of an unreviewed release)
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::commit $GITHUB_SHA is not on origin/main; refusing to publish an unreviewed release"
            exit 1
          fi

      - name: Resolve config
        id: cfg
        run: |
          set -eu
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            # CVE-refresh floor: rebuild WHATEVER is currently shipped -- read the bf16 pin from
            # deploy/Dockerfile so a frozen cron input can never refresh a config nobody ships.
            REF="$(grep -oE 'vivijure-backend:runtime-[0-9]+-(bf16|fp8)-t[0-9]+' deploy/Dockerfile | head -1)"
            [ -n "${REF}" ] || { echo "::error::could not read a RUNTIME_REF pin from deploy/Dockerfile"; exit 1; }
            TAG="${REF#*:}"                                  # e.g. runtime-1-bf16-t1
            CORE="${TAG#runtime-}"                           # 1-bf16-t1
            MVER="${CORE%%-*}"                               # 1
            PREC="$(printf '%s' "${CORE}" | cut -d- -f2)"    # bf16
            TVER="${CORE##*-t}"                              # 1
            OVERLAY=""
            echo "Scheduled CVE-refresh re-bake of the shipped runtime: ${TAG} (same tag, fresh layers)."
          else
            PREC='${{ github.event.inputs.precision }}'
            MVER='${{ github.event.inputs.model_version }}'
            TVER='${{ github.event.inputs.toolchain_version }}'
            OVERLAY='${{ github.event.inputs.overlay_from }}'
          fi
          case "${PREC}" in fp8|bf16) ;; *) echo "::error::precision must be fp8 or bf16"; exit 1;; esac
          case "${MVER}" in ''|*[!0-9]*) echo "::error::model_version must be a positive integer"; exit 1;; esac
          case "${TVER}" in ''|*[!0-9]*) echo "::error::toolchain_version must be a positive integer"; exit 1;; esac
          TAG="runtime-${MVER}-${PREC}-t${TVER}"
          if [ -n "${OVERLAY}" ]; then
            FILE="deploy/runtime-overlay.Dockerfile"
            MODE="overlay"
            echo "Deps-overlay build FROM ${OVERLAY} -> ${TAG}"
          else
            FILE="deploy/runtime.Dockerfile"
            MODE="full"
            echo "Full FROM-cuda + COPY --from=seed build -> ${TAG}"
            echo "::warning::Full rebuild may re-emit weight layer digests (t2 RunPod miss). Prefer overlay_from for deps-only bumps."
          fi
          echo "precision=${PREC}"                     >> "$GITHUB_OUTPUT"
          echo "model_version=${MVER}"                 >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"                            >> "$GITHUB_OUTPUT"
          echo "immutable_tag=${TAG}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "dockerfile=${FILE}"                    >> "$GITHUB_OUTPUT"
          echo "mode=${MODE}"                          >> "$GITHUB_OUTPUT"
          echo "overlay_from=${OVERLAY}"               >> "$GITHUB_OUTPUT"
          echo "Building ${RUNTIME_IMAGE}:${TAG} (mode=${MODE})."

      # Use the DOCKER driver (not the default docker-container driver): its build cache IS the daemon
      # image store, so the seed already cached on this Plane C GPU host from a prior bake is a warm
      # local hit for `FROM seed` instead of a re-pull. Same pull-half fix release.yml uses.
      # Single-platform amd64 needs no docker-container features (#537 pull win).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      # GHCR auth: pull the (public) seed / base runtime + push the runtime image. GITHUB_TOKEN, least-privilege.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Overlay mode: ensure the base runtime is in the local daemon so FROM hits warm + shared
      # RootFS digests are inspectable for the weight-dedup gate.
      - name: Pull overlay base runtime
        if: steps.cfg.outputs.mode == 'overlay'
        run: |
          set -eu
          BASE='${{ steps.cfg.outputs.overlay_from }}'
          echo "Pulling overlay base ${BASE}"
          docker pull "${BASE}"

      # Build the runtime image. Overlay: FROM prior runtime + pip refresh. Full: seed bins COPY
      # --from into /opt/models, then sha256 + assert gates. Load into the local daemon (not pushed
      # yet) so the per-layer + shared-diff-id gates run before publish.
      - name: Build runtime base image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ steps.cfg.outputs.dockerfile }}
          platforms: linux/amd64
          # NO pull: true -- digest-pinned FROMs; local-store hit when snap/base is warm.
          pull: false
          load: true
          push: false
          build-args: |
            VJ_BAKE_PRECISION=${{ steps.cfg.outputs.precision }}
            VJ_MODEL_VERSION=${{ steps.cfg.outputs.model_version }}
            BASE_RUNTIME_REF=${{ steps.cfg.outputs.overlay_from }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.RUNTIME_IMAGE }}:${{ steps.cfg.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.RUNTIME_IMAGE }}:${{ steps.cfg.outputs.immutable_tag }}

      # Authoritative per-layer gate: assert no image layer is >=10GB so GHCR will accept the push.
      - name: Verify image layers under the 10GB GHCR ceiling
        run: |
          set -eu
          IMG="${REGISTRY}/${OWNER}/${RUNTIME_IMAGE}:${{ steps.cfg.outputs.tag }}"
          python deploy/bake_layers.py verify-image --image "${IMG}" --ceiling-gb 10.0

      # Weight-dedup gate (overlay required; catches the t2 ~101 GB digest rewrite).
      - name: Assert weight layers shared with overlay base
        if: steps.cfg.outputs.mode == 'overlay'
        run: |
          set -eu
          IMG="${REGISTRY}/${OWNER}/${RUNTIME_IMAGE}:${{ steps.cfg.outputs.tag }}"
          BASE='${{ steps.cfg.outputs.overlay_from }}'
          python deploy/bake_layers.py assert-shared-diff-ids --image "${IMG}" --base "${BASE}" --min-shared-gb 90

      # Toolchain import smoke (no app): catch a torch/CUDA ABI break in the runtime here, in seconds,
      # rather than at the end of a 33-min GPU render. The APP import smoke runs in the consuming
      # release build (it needs COPY src).
      - name: Toolchain import smoke
        run: |
          set -eu
          IMG="${REGISTRY}/${OWNER}/${RUNTIME_IMAGE}:${{ steps.cfg.outputs.tag }}"
          docker run --rm "${IMG}" conda run --no-capture-output -n vivijure \
            python -c "import torch, torchvision, diffusers, transformers, safetensors; print('runtime import smoke OK:', torch.__version__)"

      # Session-level CUDA execution-provider check, ON A REAL GPU (backend#349). This is the layer
      # where the deps are actually installed, so it is where a bad onnxruntime wheel is born; catching
      # it here is earlier than catching it in the consuming release.
      #
      # The import smoke above cannot catch this class. A provider NAME is not a working provider:
      # onnxruntime-gpu 1.28.0 imports cleanly, advertises CUDAExecutionProvider, and then silently
      # hands back a CPU session against this CUDA 12.8 base. That is what put the InstantID face path
      # on CPU across backend-v1.0.9/1.0.10/1.0.11 without one build going red. Only creating a real
      # session catches it, and that needs a GPU attached to the container, not merely present on the
      # host. deploy/smoke_cuda_ep.py FAILS rather than skips when no GPU is visible, so a --gpus all
      # that quietly did not attach cannot read as a pass.
      #
      # The script is mounted rather than baked: the base image carries no app code, and this keeps the
      # check editable without a rebuild. Both Plane C boxes have the nvidia container runtime
      # registered in dockerd (verified 2026-07-31), so either can serve this step.
      - name: CUDA EP session check (GPU)
        run: |
          set -eu
          IMG="${REGISTRY}/${OWNER}/${RUNTIME_IMAGE}:${{ steps.cfg.outputs.tag }}"
          docker run --rm --gpus all \
            -v "${GITHUB_WORKSPACE}/deploy/smoke_cuda_ep.py:/tmp/smoke_cuda_ep.py:ro" \
            "${IMG}" conda run --no-capture-output -n vivijure python /tmp/smoke_cuda_ep.py

      - name: Push tags to GHCR
        id: push
        run: |
          set -eu
          IMG="${REGISTRY}/${OWNER}/${RUNTIME_IMAGE}"
          docker push "${IMG}:${{ steps.cfg.outputs.tag }}"
          docker push "${IMG}:${{ steps.cfg.outputs.immutable_tag }}"
          DIGEST="$(docker inspect --format '{{ index .RepoDigests 0 }}' "${IMG}:${{ steps.cfg.outputs.tag }}" | sed 's/.*@//')"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${RUNTIME_IMAGE}:${{ steps.cfg.outputs.tag }} (+ immutable) -- ${DIGEST}"

      - name: Summary (pin the runtime in deploy/Dockerfile)
        run: |
          IMG="${REGISTRY}/${OWNER}/${RUNTIME_IMAGE}"
          PREC='${{ steps.cfg.outputs.precision }}'
          ARGNAME="RUNTIME_REF_$(echo "$PREC" | tr '[:lower:]' '[:upper:]')"
          {
            echo "## Runtime base image published"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| tag | \`${IMG}:${{ steps.cfg.outputs.tag }}\` |"
            echo "| immutable tag | \`${IMG}:${{ steps.cfg.outputs.immutable_tag }}\` |"
            echo "| digest | \`${{ steps.push.outputs.digest }}\` |"
            echo "| precision | ${PREC} |"
            echo ""
            echo "Repin in \`deploy/Dockerfile\` (matching precision), then cut a backend release tag:"
            echo ""
            echo '```dockerfile'
            echo "ARG ${ARGNAME}=${IMG}:${{ steps.cfg.outputs.tag }}@${{ steps.push.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Auto-open (or update) the RUNTIME_REF repin PR so the new digest reaches BOTH consumer
      # Dockerfiles with a human merge through the gate (#537 cadence). Fixed, force-updated branch, so
      # re-bakes never pile up PRs.
      #
      # BOTH FILES, NOT ONE (backend#356). .runpod/Dockerfile is a real-file duplicate of
      # deploy/Dockerfile (the root Dockerfile is a symlink and the Hub probe does not reliably accept
      # one), and hub-files-sync.yml requires the two to be BYTE-IDENTICAL. This step used to sed
      # deploy/Dockerfile only, so every PR it opened failed `sync` by construction and the automated
      # repin path could never produce a mergeable branch.
      #
      # ASSERT THE ANCHORS BEFORE WRITING. An anchor lookup that silently matches nothing turns a
      # targeted edit into an untargeted one. Each file must contain the ARG line exactly once before
      # the sed, and exactly once carrying the new ref after it, and the two must be identical both
      # before and after. A half-repin fails here, loudly, instead of on a branch nobody reads.
      #
      # PR CREATION USES THE REST API, NOT gh (backend#356). The old step called `gh pr create` and
      # degraded to a warning, and the warning blamed the org "Actions can create PRs" setting. That
      # diagnosis was wrong: the setting is ON at both org and repo level. The actual cause is that the
      # gh CLI is NOT INSTALLED on the Plane C runners -- the very next step failed with
      # `gh: command not found` in the same run (30641630362). curl and jq are present, so the API call
      # has no unmanaged host dependency.
      #
      # AND IT FAILS LOUDLY. The old graceful-degrade is what hid this: a repin that never reaches a PR
      # is a silent no-op, and the monthly CVE-refresh cron exists precisely to be unattended. If the
      # PR cannot be opened, the run goes red.
      - name: Open/update the RUNTIME_REF repin PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          PREC='${{ steps.cfg.outputs.precision }}'
          ARGNAME="RUNTIME_REF_$(echo "$PREC" | tr '[:lower:]' '[:upper:]')"
          NEWREF="${REGISTRY}/${OWNER}/${RUNTIME_IMAGE}:${{ steps.cfg.outputs.tag }}@${{ steps.push.outputs.digest }}"
          BRANCH="auto/runtime-repin-${PREC}"
          TARGETS="deploy/Dockerfile .runpod/Dockerfile"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B "${BRANCH}" origin/main

          # --- pre-write assertions -------------------------------------------------------------
          for f in ${TARGETS}; do
            [ -f "${f}" ] || { echo "::error::${f} is missing"; exit 1; }
            n="$(grep -c "^ARG ${ARGNAME}=" "${f}" || true)"
            if [ "${n}" != "1" ]; then
              echo "::error::expected exactly 1 line matching '^ARG ${ARGNAME}=' in ${f}, found ${n}; refusing to edit"
              exit 1
            fi
          done
          if ! cmp -s deploy/Dockerfile .runpod/Dockerfile; then
            echo "::error::deploy/Dockerfile and .runpod/Dockerfile already differ on main; a repin would produce a half-synced branch. Fix the drift first."
            diff -u deploy/Dockerfile .runpod/Dockerfile || true
            exit 1
          fi

          for f in ${TARGETS}; do
            sed -i "s|^ARG ${ARGNAME}=.*|ARG ${ARGNAME}=${NEWREF}|" "${f}"
          done

          # --- post-write assertions ------------------------------------------------------------
          for f in ${TARGETS}; do
            n="$(grep -Fxc "ARG ${ARGNAME}=${NEWREF}" "${f}" || true)"
            if [ "${n}" != "1" ]; then
              echo "::error::${f} does not carry 'ARG ${ARGNAME}=${NEWREF}' exactly once after the repin (found ${n})"
              exit 1
            fi
          done
          if ! cmp -s deploy/Dockerfile .runpod/Dockerfile; then
            echo "::error::the two Dockerfiles diverged during the repin; hub-files-sync would fail on this branch"
            diff -u deploy/Dockerfile .runpod/Dockerfile || true
            exit 1
          fi

          if git diff --quiet -- ${TARGETS}; then
            echo "Both Dockerfiles already pin ${NEWREF}; nothing to repin."
            exit 0
          fi
          git add ${TARGETS}
          git commit -m "build(bake): repin ${ARGNAME} to the re-baked runtime (#537 cadence)"
          git push -f origin "${BRANCH}"

          # --- open the PR via the REST API -----------------------------------------------------
          TITLE="build(bake): repin ${ARGNAME} to the re-baked runtime (#537 cadence)"
          PRBODY="Automated RUNTIME_REF digest bump from a runtime re-bake (${{ github.event_name }}). New base: ${NEWREF}. Repins deploy/Dockerfile AND .runpod/Dockerfile together so hub-files-sync stays green. Merge through the gate to refresh the shipped CVE posture; the next backend release inherits it. Fixed branch (force-updated), so re-bakes do not pile up PRs."
          payload="$(jq -n --arg t "${TITLE}" --arg h "${BRANCH}" --arg b main --arg body "${PRBODY}" \
            '{title: $t, head: $h, base: $b, body: $body}')"
          code="$(curl -sS -o /tmp/repin-pr.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls" \
            -d "${payload}")"
          case "${code}" in
            201)
              echo "Opened $(jq -r '.html_url' /tmp/repin-pr.json)"
              ;;
            422)
              if grep -q 'A pull request already exists' /tmp/repin-pr.json; then
                echo "A PR is already open for ${BRANCH}; the force-pushed branch updates it in place."
              else
                echo "::error::PR creation rejected (HTTP 422): $(jq -c '{message, errors}' /tmp/repin-pr.json)"
                exit 1
              fi
              ;;
            *)
              echo "::error::PR creation failed (HTTP ${code}): $(jq -r '.message // "no message"' /tmp/repin-pr.json)"
              exit 1
              ;;
          esac
