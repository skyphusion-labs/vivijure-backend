name: Thin keyframe image (#530)

# No bake. No seed COPY. No .vj-baked.
# Public ubuntu-latest has about 90 GB free (14 GB is only the floor).
# The toolchain is CUDA + torch + deps. It is not the 87 GB weight set.
# --target toolchain does not pull the seed.
# Push to GHCR. Do not load the image into the runner daemon first.
# CPU import smoke runs after push. No GPU. The CUDA EP session is a SKIP.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Worker image version X.Y.Z'
        required: true
        default: '1.1.0'
        type: string
      toolchain_tag:
        description: 'Toolchain tag suffix (toolchain-<tag>)'
        required: true
        default: 't1'
        type: string
# Dispatch only. The push trigger on ci/530-thin-gha is gone with that branch: a branch build must not
# publish a release-shaped tag (X.Y.Z, toolchain-tN) to the package RunPod pulls from.

permissions:
  contents: read
  packages: write

concurrency:
  group: thin-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: skyphusion-labs
  WORKER_IMAGE: vivijure-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Publish only reviewed code: the dispatched commit must be on main, as in runtime-build.yml.
      - name: Assert commit is on main (no publish of an unreviewed build)
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::commit $GITHUB_SHA is not on origin/main; refusing to publish ${WORKER_IMAGE} tags from it"
            exit 1
          fi

      - name: Disk before build
        run: df -h /

      # Inputs arrive through env and are checked against their shape before any tag is built.
      - name: Resolve tags
        id: cfg
        env:
          VER: ${{ inputs.version }}
          TOOL: ${{ inputs.toolchain_tag }}
        run: |
          set -eu
          printf '%s' "${VER}" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+' \
            || { echo "::error::version must be X.Y.Z"; exit 1; }
          printf '%s' "${TOOL}" | grep -Eqx 't[0-9]+' \
            || { echo "::error::toolchain_tag must be t<N>"; exit 1; }
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "toolchain=toolchain-${TOOL}" >> "$GITHUB_OUTPUT"
          echo "Building ${WORKER_IMAGE}:${VER} from toolchain-${TOOL}."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push toolchain
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/runtime.Dockerfile
          target: toolchain
          platforms: linux/amd64
          push: true
          load: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.WORKER_IMAGE }}:${{ steps.cfg.outputs.toolchain }}
          cache-from: type=gha,scope=toolchain
          cache-to: type=gha,mode=max,scope=toolchain

      - name: Build and push thin worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.thin
          platforms: linux/amd64
          push: true
          load: false
          build-args: |
            TOOLCHAIN_REF=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.WORKER_IMAGE }}:${{ steps.cfg.outputs.toolchain }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.WORKER_IMAGE }}:${{ steps.cfg.outputs.version }}

      - name: CPU import smoke
        run: |
          set -eu
          IMG="${REGISTRY}/${OWNER}/${WORKER_IMAGE}:${{ steps.cfg.outputs.version }}"
          docker pull "${IMG}"
          docker run --rm "${IMG}" \
            conda run --no-capture-output -n vivijure \
            python /opt/vivijure/smoke_imports.py
          echo "Pushed ${WORKER_IMAGE}:${{ steps.cfg.outputs.version }} (thin). CUDA EP smoke needs a GPU pod."

      - name: Disk after build
        if: always()
        run: df -h /
