name: Thin keyframe image (#530)

# No bake. No seed COPY. No .vj-baked.
# Public ubuntu-latest has about 90 GB free (14 GB is only the floor).
# The toolchain is CUDA + torch + deps. It is not the 87 GB weight set.
# --target toolchain does not pull the seed.
# Push to GHCR. Do not load the image into the runner daemon first.
# CPU import smoke runs after push. No GPU. The CUDA EP session is a SKIP.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Worker image version X.Y.Z'
        required: true
        default: '1.1.0'
        type: string
      toolchain_tag:
        description: 'Toolchain tag suffix (toolchain-<tag>). Ignored when toolchain_ref is set.'
        required: false
        default: 't1'
        type: string
      smoke_ref:
        description: 'Smoke only (#636): a full digest of an existing worker image, ghcr.io/skyphusion-labs/vivijure-backend[:tag]@sha256:<64 hex>. Set: nothing is built or pushed; only the CPU import smoke runs on it.'
        required: false
        default: ''
        type: string
      toolchain_ref:
        description: 'A full digest of an existing base, ghcr.io/skyphusion-labs/<image>[:tag]@sha256:<64 hex>. Set: no toolchain build, no toolchain tag pushed; the worker is built FROM it.'
        required: false
        default: ''
        type: string
# Dispatch only. The push trigger on ci/530-thin-gha is gone with that branch: a branch build must not
# publish a release-shaped tag (X.Y.Z, toolchain-tN) to the package RunPod pulls from.

permissions:
  contents: read
  packages: write

concurrency:
  group: thin-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: skyphusion-labs
  WORKER_IMAGE: vivijure-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Publish only reviewed code: the dispatched commit must be on main, as in runtime-build.yml.
      - name: Assert commit is on main (no publish of an unreviewed build)
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::commit $GITHUB_SHA is not on origin/main; refusing to publish ${WORKER_IMAGE} tags from it"
            exit 1
          fi

      - name: Disk before build
        run: df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Inputs arrive through env. deploy/thin-image-resolve.sh checks their shape, that toolchain_ref
      # exists on GHCR, and that the version tag does NOT (a GHCR tag is never overwritten), all before
      # any build. Tests: tests/test_thin_image_resolve.py.
      - name: Resolve and check inputs
        id: cfg
        env:
          VER: ${{ inputs.version }}
          TOOL: ${{ inputs.toolchain_tag }}
          REF: ${{ inputs.toolchain_ref }}
          SMOKE: ${{ inputs.smoke_ref }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.WORKER_IMAGE }}
        run: bash deploy/thin-image-resolve.sh

      # Only without toolchain_ref. With it, no toolchain is built and no toolchain tag is pushed.
      - name: Build and push toolchain
        if: steps.cfg.outputs.mode == 'build'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/runtime.Dockerfile
          target: toolchain
          platforms: linux/amd64
          push: true
          load: false
          tags: |
            ${{ steps.cfg.outputs.toolchain_ref }}
          cache-from: type=gha,scope=toolchain
          cache-to: type=gha,mode=max,scope=toolchain

      - name: Build and push thin worker
        id: thin
        if: steps.cfg.outputs.mode != 'smoke'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.thin
          platforms: linux/amd64
          push: true
          load: false
          build-args: |
            TOOLCHAIN_REF=${{ steps.cfg.outputs.toolchain_ref }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.WORKER_IMAGE }}:${{ steps.cfg.outputs.version }}

      # The digest the push returned, read back from GHCR by tag: they must be the same image.
      - name: Pushed digest
        id: pushed
        if: steps.cfg.outputs.mode != 'smoke'
        env:
          DIGEST: ${{ steps.thin.outputs.digest }}
          IMG: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.WORKER_IMAGE }}:${{ steps.cfg.outputs.version }}
          FROM: ${{ steps.cfg.outputs.toolchain_ref }}
        run: |
          set -euo pipefail
          printf '%s' "${DIGEST}" | grep -Eqx 'sha256:[0-9a-f]{64}' || { echo "::error::the push returned no digest"; exit 1; }
          back=$(docker buildx imagetools inspect "${IMG}" --format '{{.Manifest.Digest}}')
          [ "${back}" = "${DIGEST}" ] || { echo "::error::GHCR has ${IMG} at ${back}, the push returned ${DIGEST}"; exit 1; }
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${IMG}@${DIGEST} (from ${FROM})."
          printf 'Pushed %s@%s from %s.\n' "${IMG}" "${DIGEST}" "${FROM}" >> "$GITHUB_STEP_SUMMARY"

      # #636: the image is the full base plus the thin layers (the stills base alone is 29 GiB
      # compressed). The build never unpacks it (Dockerfile.thin is FROM + COPY, so BuildKit pushes
      # by layer reference), but a pull and run must, and the runner root disk cannot hold it: the
      # 1.1.19 run died in this step with no conclusion. So Docker moves to /mnt first, and the step
      # refuses LOUDLY when there is not room, instead of filling the disk and losing the runner.
      # /mnt is NOT a separate scratch disk on the current runner: measured 2026-11-12 (run
      # 43178431220, ubuntu-latest = Ubuntu 26.04), `df -h / /mnt` prints /dev/root twice, 88 GB free.
      # The move gains nothing there; the free-space check is what protects the runner
      # (fleet-chezmoi#2620).
      - name: Move Docker storage to /mnt (the same disk on ubuntu-26.04)
        id: room
        env:
          SMOKE_REF: ${{ steps.cfg.outputs.smoke_ref }}
          DIGEST: ${{ steps.pushed.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -n "${SMOKE_REF}" ]; then IMG="${SMOKE_REF}"; else IMG="${REGISTRY}/${OWNER}/${WORKER_IMAGE}@${DIGEST}"; fi
          printf '%s' "${IMG}" | grep -Eq '@sha256:[0-9a-f]{64}$' || { echo "::error::no digest to smoke (got '${IMG}')"; exit 1; }
          echo "img=${IMG}" >> "$GITHUB_OUTPUT"
          # Compressed size of the linux/amd64 image, from the registry manifest.
          bytes=$(IMG="${IMG}" python3 deploy/image_bytes.py)
          need=$(( bytes * 5 / 2 ))   # compressed plus unpacked, with margin
          sudo systemctl stop docker.socket docker
          sudo mkdir -p /mnt/docker
          sudo python3 -c 'import json,os; p="/etc/docker/daemon.json"; d=json.load(open(p)) if os.path.exists(p) else {}; d["data-root"]="/mnt/docker"; json.dump(d, open(p,"w"))'
          sudo systemctl start docker
          [ "$(docker info --format '{{.DockerRootDir}}')" = /mnt/docker ] || { echo "::error::docker did not move to /mnt/docker"; exit 1; }
          df -h / /mnt
          avail=$(( $(df --output=avail -B1 /mnt | tail -1) ))
          echo "image ${bytes} bytes compressed; need about ${need}; /mnt has ${avail}"
          [ "${avail}" -ge "${need}" ] || { echo "::error::/mnt has ${avail} bytes free, the smoke needs about ${need}: this runner cannot hold the image"; exit 1; }

      - name: CPU import smoke
        env:
          IMG: ${{ steps.room.outputs.img }}
        run: |
          set -eu
          docker pull "${IMG}"
          docker run --rm "${IMG}" \
            conda run --no-capture-output -n vivijure \
            python /opt/vivijure/smoke_imports.py
          echo "Smoked ${IMG} (thin). CUDA EP smoke needs a GPU pod."
          printf 'Smoked %s (CPU imports).\n' "${IMG}" >> "$GITHUB_STEP_SUMMARY"

      - name: Disk after build
        if: always()
        run: df -h / /mnt
