name: changelog

# Guards backend#471: fixes were shipping with no release note because every entry landed under
# the one shared `## Unreleased` heading in CHANGELOG.md, so concurrent fix PRs collided on the same
# hunk. This job fails a PR that touches src/ without also adding a changelog.d/ fragment (or
# editing CHANGELOG.md, still accepted during the migration window). Ported from vivijure-cf's
# `changelog` job (cf#510/cf#539); see scripts/changelog-entry-required.py.
#
# Deliberately narrow, as in cf:
#   - src/ only (the code the image COPYs). Tests, docs, deploy/, scripts/ and workflow-only
#     changes do not need an entry; a check that fires on everything gets bypassed on reflex.
#   - Touch, not content. No parsing of the entry, no format enforcement. The check exists to make
#     the author STOP and decide, not to grade prose.
#   - The escape hatch is LOUD: the `no-changelog` label, so a deliberate skip is a recorded
#     decision on the PR rather than a silent one.
#
# Not one of the required checks (ci / coverage / CodeQL); this job id can be renamed freely.
#
# THREE-DOT, NOT TWO: `git diff BASE...HEAD` diffs from the merge base, so once another PR merges
# to main its files do not appear in this PR's changed list. tests/test_changelog_entry_required.py
# reproduces the two-dot false pass as a fixture and proves three-dot fixes it.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# NO CONCURRENCY GROUP, DELIBERATELY (backend#517). This workflow triggers on `labeled` and `unlabeled`
# because the escape hatch is the `no-changelog` LABEL, so the check must re-evaluate when labels
# move. Dependabot applies its labels ONE AT A TIME within two seconds of opening a PR, so a
# dependabot PR fires `opened` plus one `labeled` per label in a burst. With
# `cancel-in-progress: true` keyed on the PR number, each run in that burst cancelled the one
# before it, leaving CANCELLED check runs pinned to the PR head sha permanently. They are not
# failures, but statusCheckRollup reports them beside the real ones, so the PR reads red to a
# human and to anything counting non-SUCCESS conclusions. Measured 2026-10-20: every open
# dependabot PR in this repo carried exactly two cancelled `changelog` runs with the survivor
# green, and that cost a lead triage pass plus a full backend dispatch before anyone established
# nothing was actually broken.
#
# `cancel-in-progress: false` does NOT clear it: GitHub keeps only ONE pending run per group and
# cancels the previously pending one, so a three-event burst still leaves a cancellation behind.
# Scoping the group to the head sha does not help either, because the label events all share one
# sha. Dropping the `labeled` / `unlabeled` triggers would clear it and is wrong, because that is
# the escape hatch.
#
# So the group is gone. These jobs take seconds, this repo is PUBLIC so hosted-runner minutes are
# free, and a superseded run on a STALE sha never appears in the head sha's rollup anyway. The
# only thing the group bought was cancelling runs nobody was reading; what it cost was a PR that
# misreports its own state. If these jobs ever get expensive enough to want supersession back,
# gate it on the event rather than restoring a blanket group:
# `cancel-in-progress: ${{ github.event.action == 'synchronize' }}` cancels only on a new push,
# which is the one case where the cancelled run sits on a sha the PR has already left behind.

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The logic lives in a SCRIPT, not here, so a test can drive it against a synthetic
      # repository (tests/test_changelog_entry_required.py runs in tests.yml).
      - name: changelog.d/ fragment (or CHANGELOG.md entry) required for src/ changes
        env:
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 scripts/changelog-entry-required.py . "$BASE_SHA" "$HEAD_SHA" "$LABELS_JSON"
