name: RunPod verify harness

# The release-gate staging job (docs/release-gate.md). Build -> pod-verify (staging) -> promote (prod).
#
# STATUS (2026-07-02, truth-pass S7): the LIVE gate is now WIRED. Both prerequisites landed --
# (a) RUNPOD_API_KEY + R2_* are CI secrets, and (b) the pod-side @event emitter exists
# (vivijure_backend.verify, #175). So this workflow now grows a real live-gate job that spins ONE
# SECURE GPU pod on the candidate image, drives the structured @event verify over the run-scoped R2
# summary.json channel, and tears the pod down (delete + list-confirm zero on EVERY path) with an
# always-run reap backstop.
#
# SPEND is gated three ways: (1) the workflow is workflow_dispatch ONLY (never a PR/push -- a fork PR
# can never spin a GPU); (2) the live pod runs ONLY when the `live` input is explicitly true, else the
# no-spend DRY-RUN job runs instead; (3) a hard TTL auto-stops the pod, teardown DELETEs the pod on
# EVERY path (PASS and FAIL both end at delete + list-confirm zero; a FAIL captures its evidence to
# the R2 channel + a workflow artifact FIRST), and an always() backstop reaps (stop then DELETE) any
# pod the run created even if the job is cancelled/killed -- a stopped pad is never an exit state.
#
# PROMOTE (repin the PROD serverless endpoint t9wcvlxh8rc5la) is OFF by default: a proof run validates
# up|verify|down without ever touching prod. A real release turns `promote` on. Verify-before-require:
# this job goes REQUIRED in branch protection only AFTER a real dispatch has passed green end to end.
#
# Runner: the control job is a stock ubuntu-latest -- it only drives the RunPod API and reads the R2
# channel; the GPU is the POD, not the runner.

on:
  workflow_dispatch:
    inputs:
      live:
        description: "Spin a real SECURE GPU pod and run the live verify gate (SPENDS GPU $)."
        type: boolean
        default: false
      image:
        description: "Image ref to verify (ghcr.io/...:tag)."
        type: string
        default: "ghcr.io/skyphusion-labs/vivijure-backend:latest"
      tier:
        description: "GPU tier (i2v = the datacenter 3-arch pool)."
        type: string
        default: "i2v"
      bundle_key:
        description: "R2 key of the draft project bundle the pod renders for the verify."
        type: string
        # Default = the gate SMOKE bundle: single shot, use_characters=[] -> ZERO LoRA training
        # (empty use_characters keyframes via plain SDXL), crisp/high-detail content so the
        # sharpness gate clears (Laplacian >= 97 vs baseline 100). Exercises keyframe + i2v +
        # finish, which is the release-gate's scope. NOT Packet_Chase: that bundle carries 2 cast
        # slots with full ref sets, so the plan trains 2 LoRAs x 8800 steps (~2.3h) BEFORE any
        # keyframe -- structurally over the pod's 90-min TTL; LoRA training is out of smoke scope.
        default: "bundles/Verify_Smoke.tar.gz"
      promote:
        description: "On PASS, repin the PROD serverless endpoint to the image (leave OFF for a proof run)."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:            # never two verify pods at once
  group: runpod-verify
  cancel-in-progress: false

jobs:
  harness-dry-run:
    # The no-spend default: mocked client, no GPU, no pod, no secret. Runs whenever live is not set.
    if: ${{ inputs.live != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install verify-harness deps
        run: |
          pip install --upgrade pip
          pip install -r deploy/requirements-verify.txt

      - name: Harness dry-run (mocked client; no GPU, no spend)
        run: python deploy/runpod_verify.py

      - name: Harness dry-run, full regression evaluator (mocked)
        run: python deploy/runpod_verify.py --regression

  live-gate:
    # The real staging gate: ONE SECURE GPU pod on the candidate image, @event verify over R2, teardown.
    if: ${{ inputs.live == true }}
    runs-on: ubuntu-latest
    # MUST exceed the pod hard TTL (ttl_seconds=5400 = 90 min in deploy/runpod_verify.py) plus a
    # teardown margin, so the POD's own TTL is the true wall-clock ceiling -- never the runner. A
    # 60-min cap killed a good :0.4.1 run mid-render (26-min cold pull + i2v > 60 min): the runner
    # cancelled the job before the pod finished, aborting a passing image. 105 = 90 (TTL) + 15
    # (cold-pull slack + always() reap). Spend stays bounded by the TTL + the always-run reap.
    timeout-minutes: 105
    env:
      PYTHONPATH: src                       # src-layout: make vivijure_backend importable (pytest.ini parity)
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: vivijure                    # bucket name is not a secret
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install verify-harness deps
        run: |
          pip install --upgrade pip
          pip install -r deploy/requirements-verify.txt

      - name: Preflight -- required secrets present (presence-check only, never a value)
        run: |
          set -eu
          test -n "${RUNPOD_API_KEY:-}" || { echo "RUNPOD_API_KEY secret missing"; exit 1; }
          test -n "${R2_ENDPOINT:-}" || { echo "R2_ENDPOINT secret missing"; exit 1; }
          test -n "${R2_ACCESS_KEY_ID:-}" || { echo "R2_ACCESS_KEY_ID secret missing"; exit 1; }
          test -n "${R2_SECRET_ACCESS_KEY:-}" || { echo "R2_SECRET_ACCESS_KEY secret missing"; exit 1; }
          echo "all required verify secrets present"
          # NO-LEAK key-shape diagnostic (regex match, length, quote/whitespace edges; value never echoed)
          python deploy/runpod_verify.py --key-shape

      - name: Live verify gate (SECURE pod -> @event verify -> delete+confirm-zero; promote gated)
        run: |
          # SHARPNESS CALIBRATION (option 1, 2026-07-03) -- baseline 75.0, NOT the old 100.0 placeholder.
          # Measured Laplacian 77.5 on the visually-confirmed-good draft-fp8 clip from run 28624514409
          # (2026-07-03; lead eyeballed full.mp4: crisp rack edges, readable panel labels, in focus). So
          # 77.5 is the HONEST sharpness of a good draft-fp8 clip of this bundle; 100.0 predated any real
          # clip existing. 75.0 pins the 0.97 ratio floor at ~72.8, leaving headroom for fp8-kernel
          # nondeterminism and the #191 torch re-pin on the next bake. A REAL quant regression craters
          # sharpness far below that, so the #118 method-ii detector keeps its teeth.
          # RECALIBRATION DOCTRINE: re-measure the baseline from a confirmed-good clip whenever the smoke
          # bundle content or the i2v config changes -- NEVER move this number to make a failing run pass.
          python deploy/runpod_verify.py --live \
            --report-file verify-report.json \
            --image "${{ inputs.image }}" \
            --tier "${{ inputs.tier }}" \
            --bundle-key "${{ inputs.bundle_key }}" \
            --sharpness-baseline 75.0 \
            ${{ inputs.promote && '--promote' || '' }}

      - name: Upload verify evidence (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: verify-report.json
          if-no-files-found: warn

      - name: Teardown backstop -- REAP (delete + confirm zero) any pod this run created (always)
        if: always()
        run: |
          if [ -n "${VJ_VERIFY_POD_ID:-}" ]; then
            echo "reaping pod ${VJ_VERIFY_POD_ID} (stop -> delete -> list-confirm zero)"
            python deploy/runpod_verify.py --reap-pod "$VJ_VERIFY_POD_ID"
          else
            echo "no pod id recorded (never spun, or aborted pre-create); nothing to reap"
          fi
