name: RunPod verify harness (dry-run)

# HONEST STATUS (2026-07-02, constellation truth pass): the live pod-staging gate this workflow
# used to ADVERTISE (up | verify | promote | down against a real GPU pod) is NOT BUILT.
# deploy/runpod_verify.py has no such subcommands (its CLI takes --image/--tier/--live/
# --regression), and its live RunPod client (RunpodMcpPodClient) is a deliberately unimplemented
# seam that raises NotImplementedError. The old workflow called those phantom subcommands and
# would have crashed at step one (argparse SystemExit) on every dispatch -- a phantom gate that
# could never verify or promote anything.
#
# What IS real, and what this workflow now runs: the harness's MOCKED DRY-RUN -- parse_events +
# evaluate (and the full-regression evaluator) against the built-in PASS-shaped client. The same
# logic is unit-tested in CI (tests.yml); this dispatch exists so a human can exercise the whole
# harness and see the report shape on a stock runner. No GPU, no pod, no secrets, no spend.
#
# Promotion to the prod serverless endpoint therefore remains what it actually is today: a
# manual, deliberate endpoint pin to a :version tag. docs/release-gate.md records the intended
# DESIGN (pod = staging, serverless = production, promote only on a green pod verify); building
# the real live gate (spin pod -> verify @events -> promote -> teardown) is scheduled follow-up
# work (truth-pass S6), and this workflow grows back into it WHEN that harness exists -- not
# before.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install verify-harness deps
        run: |
          pip install --upgrade pip
          pip install -r deploy/requirements-verify.txt

      - name: Harness dry-run (mocked client; no GPU, no spend)
        run: python deploy/runpod_verify.py

      - name: Harness dry-run, full regression evaluator (mocked)
        run: python deploy/runpod_verify.py --regression
