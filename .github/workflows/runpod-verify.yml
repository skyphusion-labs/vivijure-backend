name: RunPod verify harness (dry-run)

# STATUS (2026-07-02, truth-pass S6): the LIVE RunPod client now EXISTS -- deploy/runpod_verify.py
# ships RunpodSdkPodClient, a SECURE-cloud-only client (up/down/list via the `runpod` SDK) that
# run_verify drives end to end (unit-tested against a fake SDK). What is STILL not wired here, on
# purpose, is a live JOB, because it needs two things this change does not add:
#   1. a RUNPOD_API_KEY Actions secret (a deliberate spend + credential decision), and
#   2. the pod-side verify ENTRYPOINT that emits the @event contract (gpu_probe / first_frame /
#      sharpness / complete). The image CMD today is the serverless worker, which emits no verify
#      contract, so a live pod could never reach `@event complete`. read_logs is the seam that pairs
#      with that emitter (RunpodSdkPodClient.read_logs).
# Until BOTH land, this workflow runs only the MOCKED DRY-RUN (parse_events + evaluate against the
# built-in PASS-shaped client) -- no GPU, no pod, no secret, no spend -- and promotion to the prod
# serverless endpoint stays a manual, deliberate :version pin. When both land, this workflow grows
# the live job (spin SECURE pod -> verify @events -> promote -> teardown + list-confirm-zero); NOT
# before, so it can never be a phantom gate.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install verify-harness deps
        run: |
          pip install --upgrade pip
          pip install -r deploy/requirements-verify.txt

      - name: Harness dry-run (mocked client; no GPU, no spend)
        run: python deploy/runpod_verify.py

      - name: Harness dry-run, full regression evaluator (mocked)
        run: python deploy/runpod_verify.py --regression
