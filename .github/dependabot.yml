version: 2

# skyphusion-labs Dependabot standard -- see fleet-chezmoi/docs/runbooks/dependabot-standard.md
# PRs only (never auto-merge). Group minor/patch; majors stay separate. Peer families bump together.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    # Several pins in deploy/requirements.txt cannot move by a bare version bump, and this repo learned
    # that the expensive way: dcb25ec (the 2026-07-23 pip-minor-patch group PR) bumped both and left
    # main unbuildable for eight days, because deploy/requirements.txt resolves only at runtime-base
    # bake time and no check on this repo installed it (backend#355, #351).
    #   numpy      >=2.5.0 is Requires-Python >=3.12; the runtime base conda env is 3.11.15.
    #              Moving it requires moving the env off 3.11, re-validated.
    #   av         >=19.0.0 is Requires-Python >=3.12, the same 3.11 base as numpy above; 18.1.0
    #              is the newest av that supports 3.11. Dependabot #513 proposed 19.0.1 and the
    #              resolve-hosted gate refused it, which is that gate working as designed
    #              (backend#518). Moving it means moving the env, not accepting the bump.
    #   tokenizers >0.22.2 breaks against transformers 5.14.1, which caps tokenizers<=0.23.0, and
    #              PyPI never shipped a 0.23.0 stable. It can only move PAIRED with transformers.
    #   torchao    >=0.18.0 imports torch.nn.functional.ScalingType (torch 2.10+) at package
    #              load (quantization/quantize_/workflows/float8/float8_tensor.py). Dependabot
    #              #419 bumped 0.17.0 -> 0.18.0 as a "minor"; 1.0.15 died importing Wan i2v on
    #              torch 2.7.1 (s1-41aa1926802e). Pair with a torch bump, never alone.
    # vivijure-audio-upscale carries the same numpy ignore for the same class of reason (its pin sits
    # under a numba/llvmlite ceiling). Removing either entry means bumping its partner deliberately,
    # not accepting a bare bump.
    ignore:
      - dependency-name: "numpy"
        versions: [">=2.5.0"]
      - dependency-name: "av"
        versions: [">=19.0.0"]
      - dependency-name: "tokenizers"
        versions: [">0.22.2"]
      - dependency-name: "torchao"
        versions: [">=0.18.0"]
      # onnxruntime-gpu 1.31 allows a CUDA 13 wheel. The base is CUDA 12.8
      # (test_onnxruntime_pin.py, backend#346). Ignore until that base moves.
      - dependency-name: "onnxruntime-gpu"
      # huggingface-hub 2.x does not resolve with the pinned diffusers line.
      # Revisit when diffusers permits 2.x.
      - dependency-name: "huggingface-hub"
        update-types: ["version-update:semver-major"]
    groups:
      pip-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
